name: Build & Deploy TelePro

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck and Lint
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Upload Production App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telepro-app-release
          path: dist/
          retention-days: 14

      # Deploy to Firebase Hosting if credentials exist
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.FIREBASE_SERVICE_ACCOUNT != '' || env.FIREBASE_TOKEN != ''
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SINCERE_PLATEAU_Z5WLS }}'
          channelId: live
          projectId: sincere-plateau-z5wls
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SINCERE_PLATEAU_Z5WLS }}'
          FIREBASE_TOKEN: '${{ secrets.FIREBASE_TOKEN }}'

      # Fallback CLI deploy step if FIREBASE_TOKEN secret is provided
      - name: Deploy via Firebase CLI (Fallback)
        if: env.FIREBASE_TOKEN != '' && env.FIREBASE_SERVICE_ACCOUNT == ''
        run: |
          npx firebase-tools deploy --only hosting,firestore:rules --token "${{ secrets.FIREBASE_TOKEN }}" --project sincere-plateau-z5wls
        env:
          FIREBASE_TOKEN: '${{ secrets.FIREBASE_TOKEN }}'
