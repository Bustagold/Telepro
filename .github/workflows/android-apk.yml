name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Executable
        run: chmod +x gradlew android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verify Real APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Real APK was not generated at $APK_PATH"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "Found real APK: $APK_PATH"
          echo "File size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -le 1024 ]; then
            echo "::error::Generated APK is empty or invalid ($FILE_SIZE bytes)"
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/telepro-debug.apk
          echo "Successfully staged artifacts/telepro-debug.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telepro-debug-apk
          path: artifacts/telepro-debug.apk
          if-no-files-found: error
          retention-days: 30
